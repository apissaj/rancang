name: Rancang Sync — progress badge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  badge:
    name: Update progress badge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Generate progress badge
        run: node scripts/generate-progress-badge.mjs

      - name: Commit badge if changed
        run: |
          if ! git diff --quiet -- public/badge-progress.svg; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/badge-progress.svg
            git commit -m "chore: update task progress badge [skip ci]"
            git push
            echo "badge updated"
          else
            echo "badge unchanged"
          fi